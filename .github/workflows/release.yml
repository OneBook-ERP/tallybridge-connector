name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Release + upload assets

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Cross-compile Windows binaries on macOS (zig CC for CGO + go-sqlite3)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install zig
        run: brew install zig

      - name: Parse version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Windows binaries (all arches)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: chmod +x build-windows.sh && ./build-windows.sh all

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: build/bin/tallybridge-connector-*.exe
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build Inno Setup installers on Windows (needs actual Windows runner)
  # ──────────────────────────────────────────────────────────────────────────
  build-installer:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: build/bin

      - name: Parse version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build x64 installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ steps.version.outputs.version }} ^
            /DArch=x64 ^
            build\installer\tallybridge-setup.iss

      - name: Build x86 installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ steps.version.outputs.version }} ^
            /DArch=x86 ^
            build\installer\tallybridge-setup.iss

      - name: Build arm64 installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ steps.version.outputs.version }} ^
            /DArch=arm64 ^
            build\installer\tallybridge-setup.iss

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/tallybridge-connector-setup-*.exe
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach all artifacts
  # ──────────────────────────────────────────────────────────────────────────
  release:
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/bin

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: artifacts/installers

      - name: Parse version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TallyBridge Connector v${{ steps.version.outputs.version }}"
          body: |
            ## TallyBridge Connector v${{ steps.version.outputs.version }}

            ### Installation
            Download the installer for your Windows architecture:
            | Architecture | File |
            |---|---|
            | Windows 64-bit (most PCs) | `tallybridge-connector-setup-${{ steps.version.outputs.version }}.exe` |
            | Windows 32-bit | `tallybridge-connector-setup-${{ steps.version.outputs.version }}-x86.exe` |
            | Windows ARM64 (Surface Pro X, etc.) | `tallybridge-connector-setup-${{ steps.version.outputs.version }}-arm64.exe` |

            ### Raw binaries (no installer)
            Also attached if you prefer to run without installing.
          files: |
            artifacts/installers/*.exe
            artifacts/bin/*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
